    };

    // ID von Adolf Schlatter (für besondere Hervorhebung)
    const ADOLF_ID = "P30";

    // Sprachhelfer (defensiv gegen fehlendes I18N)
    const t = (de, en) => (window.I18N ? window.I18N.t(de, en) : de);
    const isEN = () => !!(window.I18N && window.I18N.lang === 'en');
    // Sprachabhängige Auswahl der Datenfelder (Fallback auf Deutsch)
    const occ = (d) => ((isEN() && d.occupation_en) ? d.occupation_en : (d.occupation || ''));
    const inf = (d) => ((isEN() && d.info_en) ? d.info_en : (d.info || ''));

    const svg = d3.select("#tree");
    const svgElement = document.getElementById("tree");
    const height = 1400; // Vergrößerte Höhe für größere Container
    
    // Funktion zum Rendern des Stammbaums
    function renderTree() {
        const nodes = familyData.graph.nodes;
        const edges = familyData.graph.edges;

        // Idempotent: vorhandene Zeichnung entfernen, damit Re-Render (Sprachwechsel) sauber ist
        svg.selectAll("*").remove();

        // Berechne benötigte Breite basierend auf der größten Generation
        const generationsTemp = d3.group(nodes, d => d.generation_depth);
        let maxPersonsInGen = 0;
        generationsTemp.forEach((persons) => {
            if (persons.length > maxPersonsInGen) maxPersonsInGen = persons.length;
        });
        
        // Berechne Breite: Exakt die benötigte Breite basierend auf Inhalt
        const cardWidth = 180;  // Vergrößert von 140
        const cardSpacing = 70; // Vergrößert von 60
        
        // Berechne die tatsächlich benötigte Breite (später basierend auf maxWidth)
        // Wird nach der Positionierung nochmal gesetzt
        let width = 2000; // Temporärer Startwert
        
        // Setze SVG-Höhe
        svg.attr("height", height);
    
    // Gruppiere nach Generationen
    const generations = d3.group(nodes, d => d.generation_depth);
    const maxGeneration = d3.max(nodes, d => d.generation_depth);
    
    // Vertikale Positionierung - mit mehr Padding oben und unten
    const yScale = d3.scaleLinear()
        .domain([1, maxGeneration])
        .range([150, height - 100]);
    
    // Finde die breiteste Generation (für horizontale Zentrierung)
    let maxWidth = 0;
    generations.forEach((persons, gen) => {
        const genWidth = persons.length * cardWidth + (persons.length - 1) * cardSpacing;
        if (genWidth > maxWidth) maxWidth = genWidth;
    });
    
    // Berechne globalen Startpunkt für horizontale Zentrierung mit zusätzlichem Offset
    const leftPadding = 200; // Reduzierter Abstand vom linken Rand
    const globalStartX = leftPadding;
    
    // Positioniere alle Personen - horizontal zentriert
    generations.forEach((persons, gen) => {
            // Spezielle Behandlung für Generation 3 (Hektor mit zwei Frauen)
            // Reihenfolge: Elisabeth Corrodi (1. Ehe, links) - Hektor (Mitte) - Anna Bernet (2. Ehe, rechts)
            if (gen === 3 && persons.length === 3) {
                const hektor = persons.find(p => p.id === 'P5');
                const elisabeth = persons.find(p => p.id === 'P6');
                const anna = persons.find(p => p.id === 'P7');

                if (hektor && elisabeth && anna) {
                    const gen3Width = 3 * cardWidth + 2 * cardSpacing;
                    const gen3StartX = globalStartX + (maxWidth - gen3Width) / 2;

                    elisabeth.x = gen3StartX;
                    elisabeth.y = yScale(gen);

                    hektor.x = gen3StartX + (cardWidth + cardSpacing);
                    hektor.y = yScale(gen);

                    anna.x = gen3StartX + 2 * (cardWidth + cardSpacing);
                    anna.y = yScale(gen);
                }
        } else {
            // Normale Positionierung für andere Generationen
            // Gruppiere zuerst nach Elternpaaren, dann nach Ehen innerhalb der Generation
            
            // Schritt 1: Finde alle Elternpaare aus der vorherigen Generation
            const prevGenPersons = Array.from(generations.get(gen - 1) || []);
            const parentCouples = [];
            const processedParents = new Set();
            
            prevGenPersons.forEach(person => {
                if (processedParents.has(person.id)) return;
                
                const spouseEdge = edges.find(e => 
                    e.type === "MARRIED" && 
                    (e.source === person.id || e.target === person.id)
                );
                
                if (spouseEdge) {
                    const spouseId = spouseEdge.source === person.id ? spouseEdge.target : spouseEdge.source;
                    const spouse = prevGenPersons.find(p => p.id === spouseId);
                    
                    if (spouse) {
                        parentCouples.push([person.id, spouse.id]);
                        processedParents.add(person.id);
                        processedParents.add(spouse.id);
                    }
                }
            });
            
            // Schritt 2: Ordne Kinder nach ihren Eltern
            const orderedPersons = [];
            const processed = new Set();
            
            // Für jedes Elternpaar: finde ihre Kinder
            parentCouples.forEach(([parent1Id, parent2Id]) => {
                const children = persons.filter(child => {
                    if (processed.has(child.id)) return false;
                    
                    // Prüfe ob dieses Kind von diesem Elternpaar abstammt
                    const hasParent1 = edges.some(e => 
                        e.type === "PARENT_OF" && e.source === parent1Id && e.target === child.id
                    );
                    const hasParent2 = edges.some(e => 
                        e.type === "PARENT_OF" && e.source === parent2Id && e.target === child.id
                    );
                    
                    return hasParent1 && hasParent2;
                });
                
                // Ordne die Kinder: Ehepaare gruppieren (auch mit Partnern außerhalb)
                const processedChildren = new Set();

                children.forEach(child => {
                    if (processedChildren.has(child.id)) return;
                    
                    const spouseEdge = edges.find(e => 
                        e.type === "MARRIED" && 
                        (e.source === child.id || e.target === child.id)
                    );
                    
                    if (spouseEdge) {
                        const spouseId = spouseEdge.source === child.id ? spouseEdge.target : spouseEdge.source;
                        // Suche Ehepartner ÜBERALL in dieser Generation (nicht nur unter Kindern)
                        const spouse = persons.find(p => p.id === spouseId);
                        
                        if (spouse) {
                            // Ehepaar: Mann zuerst, dann Frau
                            if (child.gender === 'male') {
                                orderedPersons.push(child);
                                orderedPersons.push(spouse);
                            } else {
                                orderedPersons.push(spouse);
                                orderedPersons.push(child);
                            }
                            processedChildren.add(child.id);
                            processedChildren.add(spouse.id);
                            processed.add(child.id);
                            processed.add(spouse.id);
                            return;
                        }
                    }
                    
                    // Alleinstehende Person
                    orderedPersons.push(child);
                    processedChildren.add(child.id);
                    processed.add(child.id);
                });
            });
            
            // Füge übrige Personen hinzu (die keine Eltern in der vorherigen Gen haben)
            persons.forEach(person => {
                if (!processed.has(person.id)) {
                    orderedPersons.push(person);
                    processed.add(person.id);
                }
            });
            
            // Zentriere diese Generation horizontal relativ zur breitesten Generation
            const totalWidth = orderedPersons.length * cardWidth + (orderedPersons.length - 1) * cardSpacing;
            const startX = globalStartX + (maxWidth - totalWidth) / 2;
            
            orderedPersons.forEach((person, i) => {
                person.x = startX + i * (cardWidth + cardSpacing);
                person.y = yScale(gen);
            });
        }
    });
    
    // Berechne die tatsächlich benötigte SVG-Breite basierend auf der breitesten Generation
    const finalWidth = maxWidth + leftPadding * 2; // maxWidth + Padding links und rechts
    svg.attr("width", finalWidth);
    
    // Zeichne Verbindungslinien (Eltern-Kinder) - T-förmig mit 90-Grad-Kurven
    // Gruppiere Kinder nach ihren Eltern
    const childrenByParents = new Map();
    
    edges.filter(e => e.type === "PARENT_OF").forEach(edge => {
        const child = nodes.find(n => n.id === edge.target);
        if (!child) return;
        
        if (!childrenByParents.has(child.id)) {
            childrenByParents.set(child.id, []);
        }
        childrenByParents.get(child.id).push(edge.source);
    });
    
    // Zeichne Verbindungen für jedes Kind
    childrenByParents.forEach((parentIds, childId) => {
        const child = nodes.find(n => n.id === childId);
        const parents = parentIds.map(id => nodes.find(n => n.id === id)).filter(p => p);
        
        if (parents.length === 1) {
            // Ein Elternteil: runde Kurve
            const parent = parents[0];
            const controlX = (parent.x + child.x) / 2;
            const controlY = parent.y + (child.y - parent.y) / 2;
            
            svg.append("path")
                .attr("class", "parent-child-line")
                .attr("d", `M ${parent.x} ${parent.y} Q ${controlX} ${controlY} ${child.x} ${child.y}`)
                .attr("fill", "none");
        } else if (parents.length === 2) {
            // Zwei Elternteile: T-förmig mit runden Kurven
            const parent1 = parents[0];
            const parent2 = parents[1];
            
            // Mittelpunkt zwischen den Eltern
            const parentsMidX = (parent1.x + parent2.x) / 2;
            const parentsMidY = parent1.y; // Gleiche Y-Position wie Eltern
            
            // Ziel ist direkt das Kind
            const targetX = child.x;
            const targetY = child.y;
            
            // Horizontale Linie perfekt in der Mitte zwischen Eltern und Kind
            const midY = (parentsMidY + targetY) / 2;
            
            // Vertikale Linie nach unten bis zur Mitte
            svg.append("line")
                .attr("class", "parent-child-line")
                .attr("x1", parentsMidX)
                .attr("y1", parentsMidY)
                .attr("x2", parentsMidX)
                .attr("y2", midY);
            
            // Horizontale Linie zum Kind (eckig)
            svg.append("line")
                .attr("class", "parent-child-line")
                .attr("x1", parentsMidX)
                .attr("y1", midY)
                .attr("x2", targetX)
                .attr("y2", midY);
            
            // Vertikale Linie zum Kind (eckig)
            svg.append("line")
                .attr("class", "parent-child-line")
                .attr("x1", targetX)
                .attr("y1", midY)
                .attr("x2", targetX)
                .attr("y2", targetY);
        }
    });
    
    // Zeichne Eheverbindungen - gerade Linien
    edges.filter(e => e.type === "MARRIED").forEach(edge => {
        const spouse1 = nodes.find(n => n.id === edge.source);
        const spouse2 = nodes.find(n => n.id === edge.target);
        
        if (spouse1 && spouse2) {
            // Gerade Linie zwischen Ehepartnern
            svg.append("line")
                .attr("class", "marriage-line")
                .attr("x1", spouse1.x)
                .attr("y1", spouse1.y)
                .attr("x2", spouse2.x)
                .attr("y2", spouse2.y);
        }
    });
    
    // Zeichne geschiedene Ehen - gestrichelte Linien
    edges.filter(e => e.type === "DIVORCED").forEach(edge => {
        const spouse1 = nodes.find(n => n.id === edge.source);
        const spouse2 = nodes.find(n => n.id === edge.target);
        
        if (spouse1 && spouse2) {
            // Gestrichelte Linie zwischen geschiedenen Partnern
            svg.append("line")
                .attr("class", "divorced-line")
                .attr("x1", spouse1.x)
                .attr("y1", spouse1.y)
                .attr("x2", spouse2.x)
                .attr("y2", spouse2.y);
        }
    });
    
    // Zeichne Person-Karten - deutlich kleiner mit geschlechtsspezifischen Farben
    const personCards = svg.selectAll("rect.person-card")
        .data(nodes)
        .enter()
        .append("rect")
        .attr("class", d => {
            if (d.id === ADOLF_ID) return 'person-card adolf';
            return `person-card ${d.gender}`;
        })
        .attr("x", d => d.x - 90)  // Vergrößert auf 180
        .attr("y", d => d.y - 45)  // Vergrößert auf 90
        .attr("width", 180)        // Vergrößert von 140
        .attr("height", 90)        // Vergrößert von 70
        .attr("rx", 12);           // Vergrößert auf 12
    
    // Zeichne Namen (mit Umbruch bei langen Namen)
    // Speichere auch ob Name zweizeilig ist für spätere Y-Positionsanpassungen
    const nameTwoLines = new Set();
    
    nodes.forEach(d => {
        const name = d.name;
        const maxCharsPerLine = 25;
        
        if (name.length <= maxCharsPerLine) {
            // Eine Zeile
            svg.append("text")
                .attr("class", "person-name")
                .attr("x", d.x)
                .attr("y", d.y - 23)  // Mehr Abstand (vorher -20)
                .text(name);
        } else {
            // Name auf zwei Zeilen aufteilen
            const words = name.split(' ');
            let line1 = '';
            let line2 = '';
            
            for (let word of words) {
                if (line1.length + word.length + 1 <= maxCharsPerLine && !line2) {
                    line1 += (line1 ? ' ' : '') + word;
                } else {
                    line2 += (line2 ? ' ' : '') + word;
                }
            }
            
            svg.append("text")
                .attr("class", "person-name")
                .attr("x", d.x)
                .attr("y", d.y - 29)  // Mehr Abstand nach oben
                .text(line1);
            
            if (line2) {
                svg.append("text")
                    .attr("class", "person-name")
                    .attr("x", d.x)
                    .attr("y", d.y - 15)  // Mehr Abstand zwischen den Zeilen (vorher -17, jetzt 14px Abstand statt 10px)
                    .text(line2);
                nameTwoLines.add(d.id); // Markiere als zweizeilig
            }
        }
    });
    
    // Zeichne Lebensdaten mit Icons (Y-Position angepasst wenn Name zweizeilig)
    svg.selectAll("text.years")
        .data(nodes.filter(d => d.birth || d.death))
        .enter()
        .append("text")
        .attr("class", "person-years")
        .attr("x", d => d.x)
        .attr("y", d => d.y - 5)
        .text(d => {
            const parts = [];
            if (d.birth) parts.push(`✦ ${d.birth}`);
            if (d.death) parts.push(`† ${d.death}`);
            return parts.join('   ');
        });
    
    // Zeichne Beruf (mit automatischem Zeilenumbruch, kein Trimming)
    nodes.filter(d => occ(d).length > 0).forEach(d => {
        const occupation = occ(d);
        const maxCharsPerLine = 30;
        const nameOffset = nameTwoLines.has(d.id) ? 8 : 0; // +8px wenn Name zweizeilig
        
        if (occupation.length <= maxCharsPerLine) {
            // Eine Zeile
            svg.append("text")
                .attr("class", "person-occupation")
                .attr("x", d.x)
                .attr("y", d.y + 8 + nameOffset)  // Näher an Lebensdaten (vorher +5)
                .text(occupation);
        } else {
            // Suche nach Komma zum Aufteilen
            const commaIndex = occupation.indexOf(',');
            if (commaIndex > 0 && commaIndex <= maxCharsPerLine) {
                // Zeile 1: Bis zum Komma
                const line1 = occupation.substring(0, commaIndex).trim();
                const rest = occupation.substring(commaIndex + 1).trim();
                
                svg.append("text")
                    .attr("class", "person-occupation")
                    .attr("x", d.x)
                    .attr("y", d.y + 6 + nameOffset)  // Näher an Lebensdaten (vorher +2)
                    .text(line1);
                
                // Zeile 2: Rest (kann auch lang sein)
                if (rest.length <= maxCharsPerLine) {
                    svg.append("text")
                        .attr("class", "person-occupation")
                        .attr("x", d.x)
                        .attr("y", d.y + 16 + nameOffset)  // Mehr Abstand zwischen Zeilen
                        .text(rest);
                } else {
                    // Rest auch auf zwei Zeilen aufteilen
                    const words2 = rest.split(' ');
                    let line2a = '';
                    let line2b = '';
                    
                    for (let word of words2) {
                        if (line2a.length + word.length + 1 <= maxCharsPerLine && !line2b) {
                            line2a += (line2a ? ' ' : '') + word;
                        } else {
                            line2b += (line2b ? ' ' : '') + word;
                        }
                    }
                    
                    svg.append("text")
                        .attr("class", "person-occupation")
                        .attr("x", d.x)
                        .attr("y", d.y + 16 + nameOffset)  // Mehr Abstand zwischen Zeilen
                        .text(line2a);
                    
                    if (line2b) {
                        svg.append("text")
                            .attr("class", "person-occupation")
                            .attr("x", d.x)
                            .attr("y", d.y + 26 + nameOffset)  // Mehr Abstand zwischen Zeilen
                            .text(line2b);
                    }
                }
            } else {
                // Kein passendes Komma, intelligent umbrechen
                const words = occupation.split(' ');
                let line1 = '';
                let line2 = '';
                
                for (let word of words) {
                    if (line1.length + word.length + 1 <= maxCharsPerLine && !line2) {
                        line1 += (line1 ? ' ' : '') + word;
                    } else {
                        line2 += (line2 ? ' ' : '') + word;
                    }
                }
                
                svg.append("text")
                    .attr("class", "person-occupation")
                    .attr("x", d.x)
                    .attr("y", d.y + 6 + nameOffset)
                    .text(line1);
                
                if (line2) {
                    svg.append("text")
                        .attr("class", "person-occupation")
                        .attr("x", d.x)
                        .attr("y", d.y + 16 + nameOffset)  // Mehr Abstand zwischen Zeilen
                        .text(line2);
                }
            }
        }
    });
    
    // Zeichne Zusatz-Info (mit automatischem Zeilenumbruch)
    nodes.filter(d => inf(d).length > 0).forEach(d => {
        const location = inf(d);
        const occupationText = occ(d);
        const maxCharsPerLine = 35;
        const nameOffset = nameTwoLines.has(d.id) ? 8 : 0;

        // Berechne Y-Position basierend darauf, ob es eine Occupation gibt
        const hasOccupation = occupationText.length > 0;
        let baseY;

        if (!hasOccupation) {
            // Keine Occupation: direkt nach Lebensdaten
            baseY = d.y + 8 + nameOffset;
        } else {
            // Mit Occupation: mindestens 20px nach Lebensdaten, damit genug Platz ist
            if (occupationText.length <= 30) {
                // Kurze occupation (1 Zeile)
                baseY = d.y + 20 + nameOffset;
            } else {
                // Längere occupation (2+ Zeilen)
                const commaIndex = occupationText.indexOf(',');
                if (commaIndex > 0 && commaIndex <= 30) {
                    const rest = occupationText.substring(commaIndex + 1).trim();
                    if (rest.length > 30) {
                        baseY = d.y + 32 + nameOffset; // 3 Zeilen occupation
                    } else {
                        baseY = d.y + 26 + nameOffset; // 2 Zeilen occupation
                    }
                } else {
                    baseY = d.y + 26 + nameOffset; // 2 Zeilen occupation
                }
            }
        }
        
        if (location.length <= maxCharsPerLine) {
            // Eine Zeile
            svg.append("text")
                .attr("class", "person-location")
                .attr("x", d.x)
                .attr("y", baseY)
                .text(location);
        } else {
            // Suche nach Semikolon oder Komma zum Aufteilen
            let splitIndex = location.indexOf(';');
            if (splitIndex < 0) splitIndex = location.indexOf(',');
            
            if (splitIndex > 0 && splitIndex < 40) {
                // Zeile 1: Bis zum Trennzeichen
                svg.append("text")
                    .attr("class", "person-location")
                    .attr("x", d.x)
                    .attr("y", baseY)
                    .text(location.substring(0, splitIndex).trim());
                
                // Zeile 2: Rest
                const rest = location.substring(splitIndex + 1).trim();
                svg.append("text")
                    .attr("class", "person-location")
                    .attr("x", d.x)
                    .attr("y", baseY + 10)  // Mehr Abstand zwischen Zeilen (vorher +8)
                    .text(rest);
            } else {
                // Intelligent umbrechen
                const words = location.split(' ');
                let line1 = '';
                let line2 = '';
                
                for (let word of words) {
                    if (line1.length + word.length + 1 <= maxCharsPerLine) {
                        line1 += (line1 ? ' ' : '') + word;
                    } else {
                        line2 += (line2 ? ' ' : '') + word;
                    }
                }
                
                svg.append("text")
                    .attr("class", "person-location")
                    .attr("x", d.x)
                    .attr("y", baseY)
                    .text(line1);
                
                if (line2) {
                    svg.append("text")
                        .attr("class", "person-location")
                        .attr("x", d.x)
                        .attr("y", baseY + 10)  // Mehr Abstand zwischen Zeilen (vorher +8)
                        .text(line2);
                }
            }
        }
    });
    
    // Generation-Labels wurden entfernt für mehr Platz
    
    console.log("✅ Stammbaum gerendert!");
    console.log("👥 Sichtbare Personen:", nodes.length);
    } // Ende renderTree()

    // Initial render
    renderTree();

    // Horizontal zentrieren, damit der breite Baum mittig sichtbar ist
    function centerTree() {
        const container = document.getElementById('tree-container');
        if (!container) return;
        const svgWidth = svgElement.getBoundingClientRect().width;
        const containerWidth = container.clientWidth;
        const scrollPosition = (svgWidth - containerWidth) / 2;
        if (scrollPosition > 0) container.scrollLeft = scrollPosition;
    }

    // Scrolle horizontal in die Mitte, damit der breite Baum zentriert sichtbar ist
    setTimeout(centerTree, 50);

    // Bei Sprachwechsel den Baum mit den aktuellen (sprachabhängigen) Daten neu aufbauen
    window.addEventListener('i18n:change', () => {
        renderTree();
        setTimeout(centerTree, 50);
    });
    
    // Appbar und Footer laden
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(() => {
            if (window.appbarManager) {
                window.appbarManager.insertAppbar('appbar-container');
            }
            
            if (window.footerManager) {
                window.footerManager.insertFooter('footer-container', {
                    description: t(
                        "Genealogischer Stammbaum der Familie Schlatter ab 1699 mit Fokus auf Adolf Schlatter (1852–1938) und seinen Nachkommen bis zu den Urenkeln",
                        "Genealogical family tree of the Schlatter family from 1699 onwards, focusing on Adolf Schlatter (1852–1938) and his descendants down to the great-grandchildren"
                    )
                });
            }
        }, 50);
    });
</script>
